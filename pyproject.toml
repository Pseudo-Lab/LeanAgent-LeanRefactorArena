[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-refactor-eval"
version = "0.1.0"
description = "Checkpoint evaluation and deterministic selection for Lean refactoring"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lean-refactor-eval = "refactor_eval.cli:main"

[tool.setuptools.packages.find]
include = ["refactor_eval*"]
