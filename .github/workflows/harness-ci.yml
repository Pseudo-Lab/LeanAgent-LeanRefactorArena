name: Harness CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/first-harness/**'
      - 'tests/test_harness.py'
      - 'tests/test_runtime_integration.py'
      - 'tests/test_api_integration.py'
      - 'tests/test_prepared_cache.py'
      - 'tests/test_accounting.py'
      - 'tests/test_usage_*.py'
      - 'experiments/api-comparison/**'
      - 'experiments/usage-cost/**'
      - 'experiments/openrouter-budget-trial/**'
      - 'experiments/verification-repair-policy/**'
      - 'pyproject.toml'
      - '.github/workflows/harness-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/first-harness/**'
      - 'tests/test_harness.py'
      - 'tests/test_runtime_integration.py'
      - 'tests/test_api_integration.py'
      - 'tests/test_prepared_cache.py'
      - 'tests/test_accounting.py'
      - 'tests/test_usage_*.py'
      - 'experiments/api-comparison/**'
      - 'experiments/usage-cost/**'
      - 'experiments/openrouter-budget-trial/**'
      - 'experiments/verification-repair-policy/**'
      - 'pyproject.toml'
      - '.github/workflows/harness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Harness tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Test the harness without Lean or model API calls
        run: python -m unittest discover -s tests -p 'test_harness.py' -v
      - name: Test preflight, diagnoses and durable status without external services
        run: python -m unittest discover -s tests -p 'test_runtime_integration.py' -v
      - name: Test API usage and prepared-library integration without paid calls
        run: python -m unittest discover -s tests -p 'test_api_integration.py' -v
      - name: Test prepared-library cache invalidation and full verification boundaries
        run: python -m unittest discover -s tests -p 'test_prepared_cache.py' -v
      - name: Test shared API and subagent cost accounting
        run: python -m unittest discover -s tests -p 'test_accounting.py' -v
      - name: Test durable cost reports, pending calls and billing replay
        run: python -m unittest discover -s tests -p 'test_usage_*.py' -v
      - name: Test experiment budget guard and compatibility commands offline
        run: |
          python -m unittest discover -s experiments/api-comparison -p 'test_*.py' -v
          python -m unittest discover -s experiments/usage-cost -p 'test_*.py' -v
      - name: Test repair policies and budget adapter without Lean or API calls
        env:
          PROJECT_CACHE_DIR: ${{ runner.temp }}
        run: |
          python -m unittest discover -s experiments/openrouter-budget-trial -p 'test_*.py' -v
          python -m unittest discover -s experiments/verification-repair-policy -p 'test_*.py' -v
