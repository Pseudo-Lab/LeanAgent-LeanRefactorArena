name: Harness CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/first-harness/**'
      - 'examples/actions/**'
      - 'tests/test_harness.py'
      - 'tests/test_actions.py'
      - 'tests/test_portfolio.py'
      - 'tests/test_budgeting.py'
      - 'tests/test_repair_feedback.py'
      - 'experiments/**'
      - 'scripts/check_common_harness.py'
      - 'tests/test_runtime_integration.py'
      - 'tests/test_api_integration.py'
      - 'tests/test_prepared_cache.py'
      - 'tests/test_final_*.py'
      - 'tests/test_accounting.py'
      - 'tests/test_usage_*.py'
      - 'experiments/api-comparison/**'
      - 'experiments/usage-cost/**'
      - 'pyproject.toml'
      - '.github/workflows/harness-ci.yml'
  push:
    branches: [main, feat/common-harness-build]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/first-harness/**'
      - 'examples/actions/**'
      - 'tests/test_harness.py'
      - 'tests/test_actions.py'
      - 'tests/test_portfolio.py'
      - 'tests/test_budgeting.py'
      - 'tests/test_repair_feedback.py'
      - 'experiments/**'
      - 'scripts/check_common_harness.py'
      - 'tests/test_runtime_integration.py'
      - 'tests/test_api_integration.py'
      - 'tests/test_prepared_cache.py'
      - 'tests/test_final_*.py'
      - 'tests/test_accounting.py'
      - 'tests/test_usage_*.py'
      - 'experiments/api-comparison/**'
      - 'experiments/usage-cost/**'
      - 'pyproject.toml'
      - '.github/workflows/harness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Harness tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Test common harness and experiment contracts offline
        run: python -B scripts/check_common_harness.py
