name: Harness CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/first-harness/**'
      - 'examples/actions/**'
      - 'tests/test_harness.py'
      - 'tests/test_actions.py'
      - 'tests/test_portfolio.py'
      - 'tests/test_budgeting.py'
      - 'tests/test_repair_feedback.py'
      - 'tests/test_autosolver*.py'
      - 'experiments/**'
      - 'scripts/check_common_harness.py'
      - 'tests/test_runtime_integration.py'
      - 'tests/test_api_integration.py'
      - 'tests/test_prepared_cache.py'
      - 'tests/test_accounting.py'
      - 'tests/test_usage_*.py'
      - 'experiments/api-comparison/**'
      - 'experiments/usage-cost/**'
      - 'pyproject.toml'
      - '.github/workflows/harness-ci.yml'
  push:
    branches: [main, feat/common-harness-build]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'examples/first-harness/**'
      - 'examples/actions/**'
      - 'tests/test_harness.py'
      - 'tests/test_actions.py'
      - 'tests/test_portfolio.py'
      - 'tests/test_budgeting.py'
      - 'tests/test_repair_feedback.py'
      - 'tests/test_autosolver*.py'
      - 'experiments/**'
      - 'scripts/check_common_harness.py'
      - 'tests/test_runtime_integration.py'
      - 'tests/test_api_integration.py'
      - 'tests/test_prepared_cache.py'
      - 'tests/test_accounting.py'
      - 'tests/test_usage_*.py'
      - 'experiments/api-comparison/**'
      - 'experiments/usage-cost/**'
      - 'pyproject.toml'
      - '.github/workflows/harness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Harness tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package
        run: python -m pip install .
      - name: Test common harness and experiment contracts offline
        run: python -B scripts/check_common_harness.py

  autosolver-lean:
    name: AutoSolver (Lean ${{ matrix.lean }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lean: ['4.26.0', '4.27.0', '4.31.0']
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install the package
        run: python -m pip install .
      - name: Install pinned Elan and Lean
        env:
          LEAN_VERSION: v${{ matrix.lean }}
        run: |
          export ELAN_HOME="$RUNNER_TEMP/autosolver-elan"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/autosolver-elan.tar.gz"
          tar xzf "$RUNNER_TEMP/autosolver-elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          "$ELAN_HOME/bin/elan" toolchain install "leanprover/lean4:$LEAN_VERSION"
          echo "AUTOSOLVER_LEAN=$($ELAN_HOME/bin/elan which --toolchain leanprover/lean4:$LEAN_VERSION lean)" >> "$GITHUB_ENV"
      - name: Verify goal extraction, scoped repairs, full verification and replay
        env:
          AUTOSOLVER_LEAN_VERSION: v${{ matrix.lean }}
          AUTOSOLVER_EVIDENCE: ${{ runner.temp }}/autosolver-evidence
          PROJECT_CACHE_DIR: ${{ runner.temp }}/autosolver-tests
        run: |
          mkdir -p "$PROJECT_CACHE_DIR"
          python -B -m unittest discover -s tests -p test_autosolver_native.py -v
      - name: Preserve native verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autosolver-lean-${{ matrix.lean }}
          path: ${{ runner.temp }}/autosolver-evidence/
          if-no-files-found: warn
          retention-days: 14
